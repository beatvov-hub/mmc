name: Refresh daily quiz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate static quiz pages
        run: python3 -B scripts/generate_daily_quiz.py
      - name: Verify quiz script
        run: node --check scripts/learning-room-quiz.js
      - name: Publish generated quiz pages
        run: |
          git add -- quiz/ sitemap.xml _redirects
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh daily quiz static pages"
          git push origin HEAD:main
